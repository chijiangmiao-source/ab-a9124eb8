# Star-field identification audit console - full stack.
#
# All host ports and health-check parameters are configurable; copy
# .env.example to .env and adjust, or override via shell environment:
#   docker compose up --build
#   docker compose run --rm verify      # executable acceptance service

services:
  api:
    build: ./backend
    image: star-id-api:latest
    environment:
      SERVICE_NAME: star-id-api
    ports:
      # host:container — host side is configurable
      - "${API_HOST_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2).status==200 else 1)"]
      interval: ${HEALTHCHECK_INTERVAL:-10s}
      timeout: ${HEALTHCHECK_TIMEOUT:-3s}
      start_period: ${HEALTHCHECK_START_PERIOD:-5s}
      retries: ${HEALTHCHECK_RETRIES:-5}
    restart: unless-stopped

  web:
    build: ./web
    image: star-id-web:latest
    environment:
      # container-side listen port of nginx (also configurable)
      WEB_LISTEN_PORT: ${WEB_CONTAINER_PORT:-8080}
    ports:
      - "${WEB_HOST_PORT:-8080}:${WEB_CONTAINER_PORT:-8080}"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${WEB_CONTAINER_PORT:-8080}/healthz >/dev/null 2>&1 || exit 1"]
      interval: ${HEALTHCHECK_INTERVAL:-10s}
      timeout: ${HEALTHCHECK_TIMEOUT:-3s}
      start_period: ${HEALTHCHECK_START_PERIOD:-5s}
      retries: ${HEALTHCHECK_RETRIES:-5}
    restart: unless-stopped

  # Executable acceptance service. Runs the HTTP-level acceptance suite
  # (health + built-in scenarios + 422 localization + 20 random oracle
  # comparisons) against the live api container and exits non-zero on fail.
  # Invoke with either:
  #   docker compose run --rm verify
  #   docker compose --profile acceptance run --rm verify
  verify:
    image: star-id-api:latest
    build: ./backend
    command: ["python", "-m", "app.verify", "http://api:8000"]
    depends_on:
      api:
        condition: service_healthy
    restart: "no"
    profiles: ["acceptance"]
